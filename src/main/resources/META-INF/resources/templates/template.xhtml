<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>
            <ui:insert name="titulo">Sistema Control Precios</ui:insert>
        </title>
        <link rel="icon" type="image/png" href="#{resource['images/icon.png']}"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <h:outputStylesheet library="assets" name="css/primeflex.css"/>
        <h:outputStylesheet library="assets" name="css/primeicons.css"/>
        <h:outputStylesheet library="assets" name="css/stylle.css"/>
    </h:head>

    <h:body>
        <h:form id="menuForm">
            <p:menubar>
                <p:menuitem value="Inicio" icon="pi pi-home" outcome="/pages/home.xhtml"/>
                <p:menuitem value="Productos" icon="pi pi-box" outcome="/pages/products.xhtml"/>

                <p:menuitem value="Nuevo Usuario"
                           icon="pi pi-user-edit"
                           outcome="/pages/create_users.xhtml"
                           rendered="#{request.isUserInRole('ROLE_ADMIN')}"/>

                <p:menuitem value="Historial"
                           icon="pi pi-history"
                           outcome="/pages/historial.xhtml"
                           rendered="#{request.isUserInRole('ROLE_ADMIN')}"/>

                <f:facet name="options">
                    <span class="mr-3">
                        <i class="pi pi-user mr-2"></i>
                        <ui:insert name="nombreUsuario">Usuario</ui:insert>
                    </span>

                    <p:commandButton
                        icon="pi pi-sign-out"
                        value="Salir"
                        styleClass="p-button-danger p-button-text"
                        actionListener="#{loginMB.logout()}"
                        immediate="true"
                        ajax="false"/>
                </f:facet>
            </p:menubar>
        </h:form>

        <div class="px-4 py-8 md:px-6 lg:px-8">
            <ui:insert name="contenido">
                <p:panel header="Contenido">
                    <p>Esta es la sección de contenido por defecto.</p>
                </p:panel>
            </ui:insert>
        </div>

        <!-- Scripts personalizados de cada página -->
        <ui:insert name="scripts" />

    </h:body>
</html>
