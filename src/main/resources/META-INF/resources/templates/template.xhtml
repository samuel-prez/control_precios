<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>
            <ui:insert name="titulo">Sistema Control Precios</ui:insert>
        </title>
        <link rel="icon" type="image/png" href="#{resource['images/icon.png']}"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <h:outputStylesheet library="assets" name="css/primeflex.css"/>
        <h:outputStylesheet library="assets" name="css/primeicons.css"/>
        <h:outputStylesheet library="css" name="style.css"/>
    </h:head>

    <h:body>

        <!-- Menú principal -->
        <h:form id="menuForm">
            <p:menubar>
                <p:menuitem value="Inicio" icon="pi pi-home" outcome="/pages/home.xhtml"/>
                <p:menuitem value="Productos" icon="pi pi-box" outcome="/pages/products.xhtml"/>
                <p:menuitem value="Clientes" icon="pi pi-users" outcome="/pages/clients.xhtml"/>
                 <p:menuitem value="Cotizaciones" icon="pi pi-dollar" outcome="/pages/cotizaciones.xhtml"/>
                <!-- Solo visible para ADMIN -->
                <p:menuitem value="Nuevo Usuario" 
                           icon="pi pi-user-edit" 
                           outcome="/pages/create_users.xhtml"
                           rendered="#{request.isUserInRole('ROLE_ADMIN')}"/>

                <f:facet name="options">
                    <span class="mr-3">
                        <i class="pi pi-user mr-2"></i>
                        <ui:insert name="nombreUsuario">Usuario</ui:insert>
                    </span>

                    <!-- BOTÓN DE LOGOUT CORREGIDO -->
                    <p:commandButton 
                        icon="pi pi-sign-out" 
                        value="Salir" 
                        styleClass="p-button-danger p-button-text" 
                        actionListener="#{loginMB.logout()}"
                        immediate="true"
                        ajax="false"/>
                </f:facet>
            </p:menubar>
        </h:form>

        <!-- Banner de bienvenida -->
        <ui:insert name="bienvenida-section">
            <div class="px-4 py-8 md:px-6 lg:px-8">
                <div class="flex align-items-center justify-content-center">
                    <section class="surface-section px-4 py-5 md:px-6 lg:px-8 w-full">
                        <div class="flex flex-column lg:flex-row gap-3 justify-content-between lg:align-items-center border-primary py-5" 
                             style="border-top: 7px solid">
                            <div class="flex flex-column gap-2">
                                <div class="flex align-items-center gap-2">
                                    <h1 class="m-0 font-semibold text-900 text-xl line-height-3">
                                        Bienvenido <ui:insert name="nombreUsuario">Usuario</ui:insert>
                                    </h1>
                                </div>
                                <p class="mb-0 mt-0 text-base text-600">
                                    Estás dentro de <ui:insert name="nombrePagina">la aplicación</ui:insert>
                                </p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </ui:insert>

        <!-- Contenido dinámico -->
        <div class="px-4 py-8 md:px-6 lg:px-8">
            <ui:insert name="contenido">
                <p:panel header="Contenido">
                    <p>Esta es la sección de contenido por defecto.</p>
                </p:panel>
            </ui:insert>
        </div>

    </h:body>
</html>
