<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="../templates/template.xhtml">
    
    <ui:define name="titulo">Creador de Usuarios</ui:define>
    <ui:define name="nombreUsuario">#{loginMB.username}</ui:define>
    <ui:define name="nombrePagina">Creador de Usuarios</ui:define>

    <ui:define name="bienvenida-section">
    </ui:define>

    <ui:define name="contenido">
        
        <p:growl id="messages" showDetail="true" life="5000" />

        <h:form id="formUsuario">
            <p:panel header="Crear Nuevo Usuario" styleClass="mb-4">
                
                <div class="p-fluid create-user-form">
                    <div class="p-grid p-formgrid">
                        <div class="p-col-12 p-md-6">
                            <div class="p-field mb-3">
                                <label for="nombre" class="font-bold">Nombre de Usuario *</label>
                                <p:inputText id="nombre"
                                           value="#{usuarioController.nuevoUsuario.nombre}" />
                            </div>
                        </div>

                        <div class="p-col-12 p-md-6">
                            <div class="p-field mb-3">
                                <label for="email" class="font-bold">Correo Electrónico *</label>
                                <p:inputText id="email"
                                           value="#{usuarioController.nuevoUsuario.email}" />
                            </div>
                        </div>

                        <div class="p-col-12 p-md-6">
                            <div class="p-field mb-3">
                                <label for="password" class="font-bold">Contraseña *</label>
                                <p:password id="password"
                                          value="#{usuarioController.nuevoUsuario.password}"
                                          feedback="false"
                                          toggleMask="true" />
                            </div>
                        </div>

                        <div class="p-col-12 p-md-6">
                            <div class="p-field mb-3">
                                <label for="telefono" class="font-bold">Teléfono</label>
                                <p:inputText id="telefono"
                                           value="#{usuarioController.nuevoUsuario.telefono}" />
                            </div>
                        </div>

                        <div class="p-col-12 p-md-6">
                            <div class="p-field mb-3">
                                <label for="rol" class="font-bold">Rol *</label>
                                <p:selectOneMenu id="rol"
                                               value="#{usuarioController.rolSeleccionado}">
                                    <f:selectItem itemLabel="-- Seleccione un rol --" itemValue="" noSelectionOption="true" />
                                    <f:selectItem itemLabel="Administrador" itemValue="ROLE_ADMIN" />
                                    <f:selectItem itemLabel="Costos" itemValue="ROLE_COSTOS" />
                                    <f:selectItem itemLabel="Catálogo" itemValue="ROLE_CATALOGO" />
                                    <f:selectItem itemLabel="Consulta (Solo Lectura)" itemValue="ROLE_CONSULTA" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <p:commandButton value="Cancelar"
                                       action="/pages/home.xhtml?faces-redirect=true"
                                       styleClass="p-button-secondary"
                                       immediate="true" />

                        <p:commandButton value="Crear Usuario"
                                       action="#{usuarioController.crearUsuario()}"
                                       update="formUsuario, tablaUsuarios, messages"
                                       styleClass="p-button-success" />
                    </div>
                </div>
                
            </p:panel>
        </h:form>

        <p:panel header="Usuarios Existentes" styleClass="mt-4">
            <h:form id="tablaUsuarios">
                <p:dataTable value="#{usuarioController.usuarios}" 
                           var="usuario" 
                           emptyMessage="No hay usuarios registrados"
                           paginator="true"
                           rows="10"
                           styleClass="p-datatable-striped">
                    
                    <p:column headerText="ID" style="width: 80px">
                        <h:outputText value="#{usuario.idUsuario}" />
                    </p:column>

                    <p:column headerText="Usuario">
                        <h:outputText value="#{usuario.nombre}" />
                    </p:column>

                    <p:column headerText="Email">
                        <h:outputText value="#{usuario.email}" />
                    </p:column>

                    <p:column headerText="Teléfono" style="width: 150px">
                        <h:outputText value="#{usuario.telefono != null ? usuario.telefono : '-'}" />
                    </p:column>

                    <p:column headerText="Rol" style="width: 150px">
                        <p:badge value="#{usuario.rol.nombre}"
                               severity="#{usuario.rol.nombre eq 'ROLE_ADMIN' ? 'danger' : (usuario.rol.nombre eq 'ROLE_COSTOS' ? 'success' : (usuario.rol.nombre eq 'ROLE_CATALOGO' ? 'warning' : (usuario.rol.nombre eq 'ROLE_CONSULTA' ? 'secondary' : 'info')))}" />
                    </p:column>

                    <p:column headerText="Fecha Creación" style="width: 180px">
                        <h:outputText value="#{usuario.creadoEn}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Acciones" style="width: 100px">
                        <p:commandButton icon="pi pi-pencil"
                                       styleClass="p-button-rounded p-button-warning p-button-sm"
                                       action="#{usuarioController.prepararEdicionUsuario(usuario)}"
                                       update=":dialogEditarUsuario"
                                       oncomplete="PF('dlgEditarUsuario').show()"
                                       title="Editar" />
                    </p:column>
                </p:dataTable>
            </h:form>
        </p:panel>

        <p:dialog id="dialogEditarUsuario"
                  header="Editar Usuario"
                  widgetVar="dlgEditarUsuario"
                  modal="true"
                  responsive="true"
                  width="500">
            <h:form id="formEditarUsuario">
                <div class="p-fluid">
                    <div class="p-field mb-3">
                        <label class="font-bold">Usuario</label>
                        <p:inputText value="#{usuarioController.usuarioEditando.nombre}" disabled="true" />
                    </div>

                    <div class="p-field mb-3">
                        <label class="font-bold">Email</label>
                        <p:inputText value="#{usuarioController.usuarioEditando.email}" />
                    </div>

                    <div class="p-field mb-3">
                        <label class="font-bold">Teléfono</label>
                        <p:inputText value="#{usuarioController.usuarioEditando.telefono}" />
                    </div>

                    <div class="flex gap-2 justify-content-end mt-4">
                        <p:commandButton value="Cancelar"
                                       type="button"
                                       styleClass="p-button-secondary"
                                       onclick="PF('dlgEditarUsuario').hide()" />
                        <p:commandButton value="Guardar"
                                       action="#{usuarioController.actualizarUsuario()}"
                                       update=":tablaUsuarios :messages"
                                       oncomplete="if(!args.validationFailed) PF('dlgEditarUsuario').hide()"
                                       styleClass="p-button-success" />
                    </div>
                </div>
            </h:form>
        </p:dialog>

    </ui:define>

</ui:composition>
</html>
