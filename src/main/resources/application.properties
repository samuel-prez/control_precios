# ========== DATABASE CONFIGURATION ==========
spring.datasource.url=jdbc:mysql://localhost:336/control_precios?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=4025491
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA/HIBERNATE CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========== SERVER CONFIGURATION ==========
server.port=9000
# server.servlet.context-path=/control-precios

# ========== SPRING SECURITY ==========
# (Configuración básica, el detalle está en SecurityConfig)

# ========== JSF CONFIGURATION ==========
jakarta.faces.PROJECT_STAGE=Development
jakarta.faces.DEFAULT_SUFFIX=.xhtml
jakarta.faces.FACELETS_VIEW_MAPPINGS=*.xhtml

# ========== LOGGING CONFIGURATION ==========
logging.level.com.ritchi.control_precios=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========== SPRING BOOT CONFIGURATION ==========
spring.main.allow-bean-definition-overriding=true
spring.mvc.log-resolved-exception=true

# Configuración para subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB