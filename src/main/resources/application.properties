# ========== DATABASE CONFIGURATION ==========
spring.datasource.url=jdbc:mysql://localhost:336/control_precios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=4025491
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA/HIBERNATE CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========== HIKARICP CONNECTION POOL ==========
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ========== SERVER CONFIGURATION ==========
server.port=9000

# ========== JSF CONFIGURATION ==========
jakarta.faces.PROJECT_STAGE=Production
jakarta.faces.DEFAULT_SUFFIX=.xhtml
jakarta.faces.FACELETS_VIEW_MAPPINGS=*.xhtml
jakarta.faces.FACELETS_REFRESH_PERIOD=-1
jakarta.faces.STATE_SAVING_METHOD=server

# ========== JOINFACES CONFIGURATION ==========
joinfaces.jsf.primefaces.theme=saga
joinfaces.jsf.primefaces.font-awesome=true
joinfaces.faces.project-stage=Production

# ========== LOGGING CONFIGURATION ==========
logging.level.com.ritchi.control_precios=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.joinfaces=WARN

# ========== SPRING BOOT CONFIGURATION ==========
spring.main.allow-bean-definition-overriding=true
spring.mvc.log-resolved-exception=true

# Configuración para subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

